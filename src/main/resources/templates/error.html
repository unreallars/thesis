<!DOCTYPE html>
<html lang="en">
<head>
    <title>Error</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet" href="../static/bootstrap/css/bootstrap.min.css">
</head>
<body>
<div class="container text-center">
    <h1 class="text-danger">Something went wrong!</h1>
    <div class="alert alert-primary">
        <p>Statuscode: <span th:text="${status}"></span></p>
        <p>Error: <span th:text="${error}"></span></p>
    </div>
    <a href="/" class="btn btn-primary">Go to Homepage</a>
</div>
</body>
</html>
