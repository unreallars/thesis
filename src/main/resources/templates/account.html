<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Account</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet" href="../static/bootstrap/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <h1>Thesis</h1>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Startseite</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/match}">Suche</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ROLE_SUPERVISOR')">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ROLE_ADMIN')">
                    <a class="nav-link" th:href="@{/manage}">Verwaltung</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Account</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">Account</h2>
                </div>
                <div class="card-body">
                    <p class="card-text">
                        <strong>Github-Benutzername:</strong> <span th:text="${username}">Github-Benutzername</span>
                    </p>
                    <p class="card-text">
                        <strong>Github-ID:</strong> <span th:text="${githubId}">Github-ID</span>
                    </p>
                    <form th:action="@{/logout}" method="post">
                        <input class="btn btn-primary" type="submit" value="Abmelden">
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}" src="../static/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
