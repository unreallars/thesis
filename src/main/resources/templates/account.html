<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Account</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href=" https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css " rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <h1>Thesis</h1>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{~/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{~/match}">Suche</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ROLE_ADMIN', 'ROLE_SUPERVISOR')">
                    <a class="nav-link" th:href="@{~/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ROLE_ADMIN')">
                    <a class="nav-link" th:href="@{~/manage}">Verwaltung</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Account</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="card container mt-5">
    <div class="card-body">
        <h3 class="card-title">Account Information</h3>
        <p class="card-text">
            <strong>Benutzername:</strong> <span th:text="${user.attributes['login']}">Username</span>
        </p>

        <p class="card-text"><strong>Rollen:</strong></p>
        <ul>
            <li th:each="role : ${user.authorities}" th:text="${role.authority}">ROLE</li>
        </ul>
    </div>
</div>

</body>
</html>
