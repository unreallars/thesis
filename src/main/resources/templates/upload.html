<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href=" https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css " rel="stylesheet">
    <title>Dateiupload</title>
</head>
<body>
<div class="container text-center">
    <h1>Hier können Dateien hochgeladen werden</h1>

    <h2>Unterstützte Formate: PDF, ZIP und Markdown</h2>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" id="file" accept="application/pdf, application/zip, text/markdown"><br><br>
        <button type="submit" class="btn btn-primary">Datei hochladen</button>
    </form>

</div>
</body>
</html>
