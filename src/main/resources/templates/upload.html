<!DOCTYPE html>
<html lang="en">
<head>
    <title>Datei-Upload</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet"
          href="../static/bootstrap/css/bootstrap.min.css">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-body">

                    <div class="text-center">
                        <h1 class="mb-4">Datei-Upload</h1>

                        <a th:href="@{/dashboard}" class="btn btn-outline-primary mb-4">
                            ← Zurück
                        </a>

                        <h5 class="text-muted mb-4">
                            Unterstützte Formate: PDF, ZIP und Markdown
                        </h5>
                    </div>

                    <div th:if="${message}">
                        <div class="alert alert-info" th:text="${message}"></div>
                    </div>

                    <form method="POST" th:action="@{/upload}" enctype="multipart/form-data"
                          th:object="${uploadForm}">

                        <div class="mb-3">
                            <label for="title" class="form-label">Titel (Pflichtfeld)</label>
                            <input type="text"
                                   class="form-control"
                                   id="title"
                                   th:field="*{title}"
                                   placeholder="Titel eingeben..."
                                   required>
                        </div>
                        <div class="alert alert-danger" role="alert"
                             th:if="${#fields.hasErrors('title')}"
                             th:errors="*{title}">
                            Ungültiger Titel
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Beschreibung
                                (optional)</label>
                            <textarea class="form-control"
                                      id="description"
                                      th:field="*{description}"
                                      rows="3"
                                      placeholder="Beschreibung eingeben..."></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="file" class="form-label">Datei auswählen</label>
                            <input type="file"
                                   class="form-control"
                                   th:field="*{file}"
                                   id="file"
                                   accept="application/pdf, application/zip, text/markdown, .md, .markdown"
                                   required>
                        </div>

                        <div>
                            <span>Verknüpfen mit:</span><br>

                            <label>
                                <input type="radio"
                                       th:field="*{targetType}"
                                       value="SUPERVISOR">
                                Eigenes Betreuer-Profil
                            </label><br>

                            <label>
                                <input type="radio"
                                       th:field="*{targetType}"
                                       value="TOPIC">
                                Thema
                            </label>
                        </div>
                        <div class="alert alert-danger" role="alert"
                             th:if="${#fields.hasErrors('targetType')}"
                             th:errors="*{targetType}">
                            Ungültige Verknüpfung
                        </div>

                        <div>
                            <label for="topicId">Thema-ID (nur wenn Thema ausgewählt):</label>
                            <input class="form-control" id="topicId" th:field="*{topicId}"
                                   type="text">
                        </div>
                        <div class="alert alert-danger" role="alert"
                             th:if="${#fields.hasErrors('topicId')}"
                             th:errors="*{topicId}">
                            Ungültige UUID
                        </div>
                        <br>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Datei hochladen
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
