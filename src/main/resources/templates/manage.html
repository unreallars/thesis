<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Verwaltung</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet" href="../static/bootstrap/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <h1>Thesis</h1>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/match}">Suche</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ROLE_SUPERVISOR')">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Verwaltung</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/account}">Account</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">Verwaltung</h2>
                </div>
                <div class="card-body">
                    <div th:if="${message}">
                        <div class="alert alert-info" th:text="${message}"></div>
                    </div>

                    <form th:action="@{/manage}" method="post">
                        <div class="mb-3">
                            <label for="userId" class="form-label">User ID eingeben</label>
                            <input type="number"
                                   name="userId"
                                   class="form-control"
                                   id="userId"
                                   placeholder="z.B. 123"
                                   required>
                            <div class="form-text">Gib die ID des Users ein, den du zum Betreuer machen möchtest.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Zum Betreuer befördern</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}" src="../static/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
