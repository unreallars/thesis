<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet"
          href="../static/bootstrap/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <h1>Thesis</h1>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/match}">Suche</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ROLE_ADMIN')">
                    <a class="nav-link" th:href="@{/manage}">Verwaltung</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/account}">Account</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <h1 class="mb-4 text-center text-primary">Dashboard</h1>

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">
                        <i class="bi bi-person-circle me-2"></i>
                        Profil-Informationen
                    </h2>
                </div>
                <div class="card-body p-4">
                    <form method="POST" th:action="@{/updateMail}" th:object="${emailForm}">
                        <div class="row mb-4">
                            <div class="col-12">
                                <div class="form-floating">
                                    <input type="email"
                                           class="form-control form-control-lg"
                                           id="mail"
                                           th:field="*{email}"
                                           placeholder="Ihre Kontakt E-Mail-Adresse">
                                    <label for="mail" class="text-muted">
                                        <i class="bi bi-envelope me-1"></i>
                                        Kontakt-Mail
                                    </label>
                                    <div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('email')}"
                                         th:errors="*{email}">
                                        Ungültige Email
                                    </div>
                                    <br>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-save me-2"></i>
                                Speichern
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-body p-4">
                    <form method="POST" th:action="@{/addTag}">
                        <div class="row mb-4">
                            <div class="col-12">
                                <div class="form-floating">
                                    <input type="text"
                                           class="form-control form-control-lg"
                                           id="tags"
                                           name="tags"
                                           placeholder="newtag1, newtag2, newtag3">
                                    <label for="tags" class="text-muted">
                                        <i class="bi bi-envelope me-1"></i>
                                        Fachgebite / Tags hinzufügen
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-save me-2"></i>
                                Speichern
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-6 col-lg-3">
                    <a th:href="@{/upload}" class="btn btn-outline-primary btn-lg w-100 h-100 p-4 text-decoration-none">
                        <div class="text-center">
                            <i class="bi bi-cloud-upload display-4 text-primary mb-3 d-block"></i>
                            <span class="fs-5 fw-bold d-block">Datei-Upload</span>
                        </div>
                    </a>
                </div>

                <div class="col-md-6 col-lg-3">
                    <a th:href="@{/addLink}"
                       class="btn btn-outline-success btn-lg w-100 h-100 p-4 text-decoration-none">
                        <div class="text-center">
                            <i class="bi bi-link-45deg display-4 text-success mb-3 d-block"></i>
                            <span class="fs-5 fw-bold d-block">Links</span>
                        </div>
                    </a>
                </div>

                <div class="col-md-6 col-lg-3">
                    <a th:href="@{/addTopic}"
                       class="btn btn-outline-warning btn-lg w-100 h-100 p-4 text-decoration-none">
                        <div class="text-center">
                            <i class="bi bi-checklist display-4 text-warning mb-3 d-block"></i>
                            <span class="fs-5 fw-bold d-block">Themen</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}" src="../static/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
