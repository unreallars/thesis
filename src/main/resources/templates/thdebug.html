<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thymeleaf Debug</title>
</head>
<body>
<table border="1" class="table table-striped">
    <thead>
    <tr>
        <th>Attribute-Name</th>
        <th>Value</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="var : ${#vars.getVariableNames()}">
        <td th:text="${var}"></td>
        <td th:text="${#vars.getVariable(var)}"></td>
    </tr>
    </tbody>
    <tbody>
    <tr>
        <td>param</td>
        <td th:text="${#vars.getVariable('param')}"></td>
    </tr>
    <tr>
        <td>session</td>
        <td th:text="${#vars.getVariable('session')}"></td>
    </tr>
    <tr>
        <td>application</td>
        <td th:text="${#vars.getVariable('application')}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
