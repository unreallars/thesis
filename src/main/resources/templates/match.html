<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Suche</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet"
          href="../static/bootstrap/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <h1>Thesis</h1>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Startseite</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Suche</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ROLE_SUPERVISOR')">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ROLE_ADMIN')">
                    <a class="nav-link" th:href="@{/manage}">Verwaltung</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/account}">Account</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Matching</h3>
                </div>

                <div th:if="${topicMatches != null && !topicMatches.isEmpty()}" class="mb-5">
                    <h3 class="mb-3">
                        <span th:text="${topicMatches.size()}"></span> passende Themen gefunden:
                    </h3>

                    <div class="list-group">
                        <a th:each="tMatch : ${topicMatches}"
                           th:href="@{'/topic/' + ${tMatch.topicId}}"
                           class="list-group-item list-group-item-action">
                            <div class="d-flex w-100 justify-content-between">
                                <h5 class="mb-1" th:text="${tMatch.topicTitle}">Topic Titel</h5>
                            </div>
                            <p class="mb-1 text-muted" th:text="${tMatch.topicDescription}">Themenbeschreibung...</p>
                        </a>
                    </div>
                </div>

                <div th:if="${topicMatches != null && topicMatches.isEmpty()}" class="text-center py-5">
                    <div class="display-5 mb-3">😔</div>
                    <h4>Keine passenden Themen gefunden</h4>
                </div>

                <div th:if="${supervisorMatches != null && !supervisorMatches.isEmpty()}" class="mb-5">
                    <h3 class="mb-3">
                        <span th:text="${supervisorMatches.size()}"></span> passende Betreuer gefunden:
                    </h3>

                    <div class="list-group">
                        <a th:each="sMatch : ${supervisorMatches}"
                           th:href="@{'/supervisor/' + ${sMatch.supervisorId}}"
                           class="list-group-item list-group-item-action">
                            <div class="d-flex w-100 justify-content-between">
                                <h5 class="mb-1" th:text="${sMatch.supervisorUsername}">Supervisor Username</h5>
                            </div>
                        </a>
                    </div>
                </div>

                <div th:if="${supervisorMatches != null && supervisorMatches.isEmpty()}" class="text-center py-5">
                    <div class="display-5 mb-3">😔</div>
                    <h4>Keine passenden Betreuer gefunden</h4>
                </div>


            </div>
            <div class="card-body p-4">
                <form th:action="@{/match}" method="post">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Bestandene Kurse auswählen</label>
                        <div class="row">
                            <div th:each="req,reqStat : ${requirements}" class="col-md-6 col-lg-4 mb-3">
                                <div class="form-check">
                                    <!--suppress HtmlFormInputWithoutLabel -->
                                    <input type="checkbox"
                                           class="form-check-input"
                                           name="completedRequirements"
                                           th:value="${req}"
                                           th:id="'req_' + ${reqStat.index}"/>
                                    <label class="form-check-label"
                                           th:for="'req_' + ${reqStat.index}"
                                           th:text="${req}">Requirement</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="interests" class="form-label fw-bold">Interessen angeben</label>
                        <input type="text"
                               class="form-control form-control-lg"
                               id="interests"
                               name="interests"
                               placeholder="z.B. KI, Web, Datenbank"/>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Matching starten</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}" src="../static/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
