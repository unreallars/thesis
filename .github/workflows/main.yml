name: Java Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      name: Git Checkout
    - name: Java installieren
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Berechtigung für Gradle
      run: chmod +x ./gradlew
    - name: Run Gradle
      run: ./gradlew check
