plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id "com.github.spotbugs" version "6.5.13"
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'thesis'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

import com.github.spotbugs.snom.Effort
spotbugs {
    effort.set(Effort.MAX)
}

tasks.named('spotbugsMain') {
    reports {
        register('xml') { required = false }
        register('html') { required = true }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.10.5'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'org.commonmark:commonmark:0.30.1'

    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
}

tasks.named('test') {
    useJUnitPlatform()
}
test {
    jvmArgs '-Xshare:off'

    doFirst {
        def agentFile = configurations.testRuntimeClasspath.find { it.name.contains('byte-buddy-agent') }
        if (agentFile) {
            jvmArgs "-javaagent:${agentFile.absolutePath}"
        }
    }
}